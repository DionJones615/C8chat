name: Bug report
description: Report a problem with C8 Chat
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include account keys, private messages, or other players' personal
        information. Security issues should use the Security tab, not this form.
  - type: input
    id: version
    attributes:
      label: C8 Chat version
      description: From chrome://extensions or about:addons.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142+ / Chrome 121+ / Edge 121+
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Linux, Windows, macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://www.castleinfinity.com/
        2. Click the gold infinity button
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Redact names, messages, and keys that are not necessary.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Checklist
      options:
        - label: I removed account keys, private messages, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true

name: Feature request
description: Suggest a feature or improvement for C8 Chat
title: 'feature: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        C8 Chat deliberately avoids inventory, stash, postcards, macros, and
        automation until the protocol is understood and the maintainer agrees to
        the scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should C8 Chat do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat transcript
        - Room / player presence
        - Private messages
        - Dock / floating layout
        - Themes / settings
        - Debug / protocol
        - Packaging / docs / CI
    validations:
      required: true

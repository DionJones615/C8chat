name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify versions
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm audit --omit=dev
      - name: List artifacts
        run: sha256sum dist/c8-chat-*.zip dist/c8-chat-*.xpi dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/c8-chat-*-chrome.zip \
            dist/c8-chat-*-firefox.xpi \
            dist/c8-chat-*-source.zip \
            dist/SHA256SUMS \
            --title "C8 Chat $GITHUB_REF_NAME" \
            --generate-notes
